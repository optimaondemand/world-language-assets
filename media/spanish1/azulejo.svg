<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Sevillian cuerda-seca tile (our own drawing): cream glaze, dark 'dry cord' outlines, blue star, ochre heart, green corner leaves -->
  <rect width="100" height="100" fill="#f4ecd8"/>
  <g stroke="#2a1f16" stroke-width="1.6" stroke-linejoin="round">
    <!-- corner quarter-rosettes (form a full rosette where four tiles meet) -->
    <g fill="#2f6b45">
      <path d="M0 0 L22 0 Q14 8 0 22 Z"/><path d="M100 0 L78 0 Q86 8 100 22 Z"/>
      <path d="M0 100 L22 100 Q14 92 0 78 Z"/><path d="M100 100 L78 100 Q86 92 100 78 Z"/>
    </g>
    <g fill="#d9a33a">
      <circle cx="0" cy="0" r="7"/><circle cx="100" cy="0" r="7"/><circle cx="0" cy="100" r="7"/><circle cx="100" cy="100" r="7"/>
    </g>
    <!-- edge half-lobes (join into lobes across tiles) -->
    <g fill="#1d4e8f">
      <path d="M38 0 Q50 14 62 0 Z"/><path d="M38 100 Q50 86 62 100 Z"/>
      <path d="M0 38 Q14 50 0 62 Z"/><path d="M100 38 Q86 50 100 62 Z"/>
    </g>
    <!-- central eight-point star: two squares -->
    <path fill="#1d4e8f" d="M50 14 L60.6 39.4 L86 50 L60.6 60.6 L50 86 L39.4 60.6 L14 50 L39.4 39.4 Z"/>
    <path fill="#1d4e8f" d="M24.5 24.5 L44 36 L50 30 L56 36 L75.5 24.5 L64 44 L70 50 L64 56 L75.5 75.5 L56 64 L50 70 L44 64 L24.5 75.5 L36 56 L30 50 L36 44 Z" opacity=".0"/>
    <rect x="31" y="31" width="38" height="38" fill="#2c66b0" transform="rotate(45 50 50)"/>
    <rect x="34" y="34" width="32" height="32" fill="#f4ecd8"/>
    <path fill="#d9a33a" d="M50 36 L54 46 L64 50 L54 54 L50 64 L46 54 L36 50 L46 46 Z"/>
    <circle cx="50" cy="50" r="3.2" fill="#9b1b30"/>
  </g>
</svg>
